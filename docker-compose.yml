services:
  web:
    image: nginx:alpine
    container_name: goldenhourai
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Senza questo mount /var/log/nginx/{access,error}.log sono symlink a
      # stdout/stderr: i log finirebbero nel json-file di Docker, che qui non
      # ha rotazione e cresce all'infinito. Montando la cartella nginx scrive
      # file veri, che scripts/rotate-logs.sh ruota e cancella a 30 giorni.
      - ./logs:/var/log/nginx
    # Rete di sicurezza: ora che i log vanno su file, su stdout resta poco,
    # ma il driver di default non ha comunque un tetto.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.goldenhourai.rule=Host(`goldenhourai.it`)"
      - "traefik.http.routers.goldenhourai.entrypoints=websecure"
      - "traefik.http.routers.goldenhourai.tls=true"
      - "traefik.http.routers.goldenhourai.tls.certresolver=letsencrypt"
      - "traefik.http.services.goldenhourai.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
