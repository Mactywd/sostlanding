server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Location relativi nei redirect. Il TLS termina su Traefik, quindi dentro
    # al container $scheme e' sempre "http": con i redirect assoluti (default)
    # nginx risponderebbe "Location: http://goldenhourai.it/..." e il browser
    # farebbe un hop in piu' su Cloudflare prima di tornare in https.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml+rss image/svg+xml font/woff2;

    # Any location block with its own add_header directives must repeat these,
    # because nginx child add_header directives replace the parent's entirely.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Legacy: /sostituzioni era il path di Aurora prima del rebrand. Restano
    # link esterni e risultati di ricerca che lo puntano, quindi il 301 e'
    # permanente e va tenuto. $1 preserva sotto-percorsi e asset.
    #
    # Deve stare prima dei location regex per css/js e media: nginx sceglie il
    # primo regex che matcha in ordine di definizione, quindi se venisse dopo,
    # /sostituzioni/styles.css finirebbe in 404 invece che sul redirect.
    location = /sostituzioni {
        return 301 /aurora/;
    }
    location ~ ^/sostituzioni/(.*)$ {
        return 301 /aurora/$1;
    }

    # Fonts and media: safe to cache for a year (content never changes by name)
    location ~* \.(woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # CSS/JS: i file non sono content-hashed e l'HTML e' no-store, quindi una
    # cache "fresca per N tempo" produce HTML nuovo + CSS vecchio dopo ogni
    # deploy, cioe' pagine rotte. "no-cache" non disattiva la cache: obbliga a
    # rivalidare, e con ETag/Last-Modified la risposta e' quasi sempre un 304.
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Redirect /atelier (no trailing slash) to /atelier/
    location = /atelier {
        return 301 /atelier/;
    }

    # Atelier sub-site
    location /atelier/ {
        try_files $uri $uri/ /atelier/index.html;
        expires -1;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Redirect /aurora (no trailing slash) to /aurora/
    location = /aurora {
        return 301 /aurora/;
    }

    # Aurora sub-site: served from ./aurora/ subdirectory
    location /aurora/ {
        try_files $uri $uri/ /aurora/index.html;
        expires -1;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Main GoldenHour AI landing
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    error_page 404 /index.html;
}
