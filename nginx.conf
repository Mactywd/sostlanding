server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Location relativi nei redirect. Il TLS termina su Traefik, quindi dentro
    # al container $scheme e' sempre "http": con i redirect assoluti (default)
    # nginx risponderebbe "Location: http://goldenhourai.it/..." e il browser
    # farebbe un hop in piu' su Cloudflare prima di tornare in https.
    absolute_redirect off;

    # I log restano 30 giorni: e' il termine dichiarato in /privacy/. Non e'
    # nginx a farlo rispettare: /var/log/nginx e' montato da ./logs e la
    # rotazione gira da cron sull'host (scripts/rotate-logs.sh). Se si cambia
    # il termine qui, va cambiato in entrambi i posti piu' l'informativa.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml+rss image/svg+xml font/woff2;

    # Any location block with its own add_header directives must repeat these,
    # because nginx child add_header directives replace the parent's entirely.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Legacy: /sostituzioni era il path di Aurora prima del rebrand. Restano
    # link esterni e risultati di ricerca che lo puntano, quindi il 301 e'
    # permanente e va tenuto. $1 preserva sotto-percorsi e asset.
    #
    # Deve stare prima dei location regex per css/js e media: nginx sceglie il
    # primo regex che matcha in ordine di definizione, quindi se venisse dopo,
    # /sostituzioni/styles.css finirebbe in 404 invece che sul redirect.
    location = /sostituzioni {
        return 301 /aurora/;
    }
    location ~ ^/sostituzioni/(.*)$ {
        return 301 /aurora/$1;
    }

    # Legacy: /gos/ era la pagina di Luce quando il prodotto si chiamava
    # GoldenHour OS. Le pagine legali /gos/privacy/ e /gos/termini/ sono
    # citate dalla schermata di consenso di Google: il 301 tiene vivi quei
    # link, quindi va tenuto. A differenza di /sostituzioni porta con se' la
    # query string, perche' sulle pagine prodotto arrivano gli utm_* delle
    # campagne. Stessa regola d'ordine: prima dei location regex di css/js
    # e media.
    location = /gos {
        return 301 /luce/$is_args$args;
    }
    location ~ ^/gos/(.*)$ {
        return 301 /luce/$1$is_args$args;
    }

    # Fonts and media: safe to cache for a year (content never changes by name)
    location ~* \.(woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # CSS/JS: i file non sono content-hashed e l'HTML e' no-store, quindi una
    # cache "fresca per N tempo" produce HTML nuovo + CSS vecchio dopo ogni
    # deploy, cioe' pagine rotte. "no-cache" non disattiva la cache: obbliga a
    # rivalidare, e con ETag/Last-Modified la risposta e' quasi sempre un 304.
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Redirect /atelier (no trailing slash) to /atelier/
    location = /atelier {
        return 301 /atelier/;
    }

    # Atelier sub-site
    location /atelier/ {
        try_files $uri $uri/ =404;
        expires -1;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Redirect /luce (senza slash finale) a /luce/, con la query string:
    # l'annuncio puo' puntare a /luce?utm_source=... e gli utm non vanno persi.
    location = /luce {
        return 301 /luce/$is_args$args;
    }

    # Luce: pagina prodotto e pagine legali. Il video in assets/ non passa
    # da qui ma dal location dei media (cache di un anno): se cambia il
    # file, cambia anche il nome.
    location /luce/ {
        try_files $uri $uri/ =404;
        expires -1;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Landing degli annunci di Luce (modulo di candidatura al pilota). Come per
    # /luce, il redirect senza slash tiene la query string con gli utm.
    # /luce-landing/ e' servita dal location / qui sotto: il prefisso /luce/
    # non la cattura, perche' dopo "luce" viene "-" e non "/".
    location = /luce-landing {
        return 301 /luce-landing/$is_args$args;
    }

    # Redirect /aurora (no trailing slash) to /aurora/
    location = /aurora {
        return 301 /aurora/;
    }

    # Aurora sub-site: served from ./aurora/ subdirectory
    location /aurora/ {
        try_files $uri $uri/ =404;
        expires -1;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Main GoldenHour AI landing
    location / {
        try_files $uri $uri/ =404;
        expires -1;
        add_header Cache-Control "no-store";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Un URL inesistente deve rispondere 404, non 200 con la landing. Il
    # fallback precedente serviva /index.html a qualsiasi path: ha tenuto
    # nascosto per settimane il fatto che /gos/ (oggi /luce/) non fosse deployato.
    error_page 404 /404.html;
}
